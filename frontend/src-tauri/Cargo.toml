[package]
name = "todo-desktop"
version = "0.1.0"
description = "待办任务清单桌面版"
authors = ["wuzhi"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

[lib]
name = "todo_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.5", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.12.6", features = [] }
tauri-plugin-single-instance = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
tauri-plugin-autostart = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
